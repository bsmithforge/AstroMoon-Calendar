<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found (404) | AstroMoon Cal</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #F3EDDF;
        color: #182421;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        background: #FAF7F0;
        border: 1px solid #D8D0BF;
        border-radius: 8px;
        max-width: 480px;
        width: 100%;
        padding: 32px;
        text-align: center;
        box-shadow: 0 4px 16px rgba(24, 36, 33, 0.06);
      }
      h1 {
        font-family: 'Newsreader', Georgia, serif;
        font-size: 28px;
        margin: 0 0 12px;
        color: #182421;
      }
      .code {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #B44732;
        background: rgba(180, 71, 50, 0.1);
        border: 1px solid rgba(180, 71, 50, 0.25);
        padding: 4px 10px;
        border-radius: 9999px;
        margin-bottom: 16px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #657367;
        margin: 0 0 24px;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background-color: #182421;
        color: #F3EDDF;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        transition: background-color 0.15s ease;
      }
      a:hover {
        background-color: #253631;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="code">Error 404</span>
      <h1>Celestial Coordinate Not Found</h1>
      <p>The requested astrological path or astronomical page does not exist in the AstroMoon ephemeris directory.</p>
      <a href="/">Return to AstroMoon Calendar</a>
    </div>
  </body>
</html>
